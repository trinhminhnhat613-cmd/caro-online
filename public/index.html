<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caro Online</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%236c5ce7'/><path d='M9 9l14 14M23 9L9 23' stroke='white' stroke-width='3.5' stroke-linecap='round'/></svg>">
<style>
:root{--bg:#f3f5fa;--card:#fff;--ink:#1c2230;--mute:#7a8396;--line:#e1e6f0;--accent:#6c5ce7;--ai:#fff;--me:#e9e6ff;--board:#fff;--grid:#cfd6e6;--okbg:rgba(24,182,106,.25);--lastbg:rgba(255,190,0,.3);--ok:#18b66a;--danger:#e5484d;--glow:none}
[data-theme=dark]{--bg:#12151c;--card:#1b2029;--ink:#e8ebf3;--mute:#8b95a8;--line:#2a313e;--accent:#8b7dff;--me:#2d2a52;--board:#1b2029;--grid:#3a4458;--lastbg:rgba(255,200,0,.22)}
[data-theme=sakura]{--bg:#fff1f5;--card:#fffafb;--ink:#4a2b36;--mute:#a98791;--line:#f6d3df;--accent:#e8789a;--me:#ffe0ea;--board:#fffafb;--grid:#f0c4d3;--lastbg:rgba(232,120,154,.25)}
[data-theme=tulip]{--bg:#fff4f1;--card:#fffdfb;--ink:#3b2230;--mute:#9b7b83;--line:#f7d7d2;--accent:#e0364f;--me:#ffe3e0;--board:#fffdf8;--grid:#efc6c0}
[data-theme=pink]{--bg:#ffeef7;--card:#fff8fc;--ink:#5a2a46;--mute:#b57c9b;--line:#ffd0e8;--accent:#ff6fb0;--me:#ffdcee;--board:#fffafd;--grid:#ffc2e0;--lastbg:rgba(255,111,176,.25)}
[data-theme=neon]{--bg:#07070f;--card:#0e0e1c;--ink:#e8f9ff;--mute:#7e8aa8;--line:#1f2447;--accent:#00e5ff;--ai:#001018;--me:#0f2a3a;--board:#0a0a18;--grid:#1d3a7a;--okbg:rgba(0,255,160,.28);--lastbg:rgba(255,0,200,.28);--danger:#ff3b6b;--glow:0 0 14px rgba(0,229,255,.28)}
[data-theme=ocean]{--bg:#e9f5ff;--card:#fff;--ink:#12324d;--mute:#6a8aa3;--line:#cfe5f6;--accent:#1e88e5;--me:#d7ebff;--board:#f6fbff;--grid:#bcd8ee}
[data-theme=forest]{--bg:#eef6ee;--card:#fbfffb;--ink:#1d3a26;--mute:#6f8f78;--line:#d3e6d6;--accent:#2e9e5b;--me:#d8f0de;--board:#fafffa;--grid:#bfd9c4}
[data-theme=sunset]{--bg:#fff1e6;--card:#fffaf5;--ink:#4a2a1a;--mute:#a68570;--line:#fbd9bf;--accent:#ff6b35;--me:#ffe2cf;--board:#fffaf4;--grid:#f2cdb0}
[data-theme=lavender]{--bg:#f3eefe;--card:#fcfaff;--ink:#2d2447;--mute:#8a7fa8;--line:#e0d6f5;--accent:#8e6bdc;--me:#e8defc;--board:#fdfbff;--grid:#d3c7ee}
[data-theme=coffee]{--bg:#f1e6d8;--card:#fbf4ea;--ink:#3b2a1c;--mute:#8d7560;--line:#e2d0ba;--accent:#8b5a2b;--me:#f0dcc2;--board:#efd7ae;--grid:#b98f5a;--lastbg:rgba(139,90,43,.28)}
[data-theme=galaxy]{--bg:#100c24;--card:#181334;--ink:#ece8ff;--mute:#8f86bd;--line:#2b2455;--accent:#a78bfa;--ai:#140a30;--me:#2a2159;--board:#14102c;--grid:#3a3070;--glow:0 0 14px rgba(167,139,250,.22)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent;transition:background .3s,color .3s}
header{display:flex;align-items:center;gap:8px;height:50px;padding:0 12px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
header a{color:var(--ink);text-decoration:none}
.logo{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px}
.logo i{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--ai);font-style:normal;font-size:15px}
.sp{flex:1}
.net{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:5px;white-space:nowrap}
.net b{width:9px;height:9px;border-radius:50%;background:#bbb;display:inline-block}
.net.ok b{background:var(--ok)}.net.bad b{background:var(--danger)}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:7px 13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button:hover,.btn:hover{border-color:var(--accent)}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--ai)}
button.danger{color:var(--danger)}
button[hidden],[hidden]{display:none!important}
button:disabled{opacity:.5;cursor:default}
.ib{padding:5px 9px;font-size:16px}
input[type=text],select{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:8px 10px;min-width:0}
input[type=text]:focus,select:focus{outline:2px solid color-mix(in srgb,var(--accent) 40%,transparent);border-color:var(--accent)}
main{max-width:1200px;margin:0 auto;padding:14px;position:relative;z-index:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--glow)}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#fx span{position:absolute;top:-40px;animation:fall linear infinite;opacity:.8}
@keyframes fall{0%{transform:translate3d(0,-40px,0) rotate(0)}100%{transform:translate3d(var(--sw,40px),105vh,0) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){#fx{display:none}}
/* Popover */
.pop{position:fixed;top:56px;right:10px;z-index:40;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;width:min(340px,calc(100vw - 20px));box-shadow:0 10px 30px rgba(0,0,0,.25)}
.pop h4{margin:0 0 8px;font-size:14px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin-bottom:6px}
.chip2{display:flex;align-items:center;gap:7px;padding:6px 8px;border:2px solid var(--line);border-radius:10px;cursor:pointer;font-size:13px;background:var(--bg)}
.chip2.on{border-color:var(--accent)}
.chip2 i{width:16px;height:16px;border-radius:50%;border:1px solid rgba(128,128,128,.4);flex:none}
.shapes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.shapes button{padding:6px;justify-content:center}
.shapes button.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.sw{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.sw button{width:26px;height:26px;border-radius:50%;padding:0;border:2px solid transparent}
.sw button.on{border-color:var(--ink)}
.sw input[type=color]{width:30px;height:28px;padding:0;border:0;background:none}
/* Lobby */
.lobby{max-width:540px;margin:24px auto;display:grid;gap:14px}
.lobby h1{margin:0 0 2px;font-size:24px}
.lobby p{margin:0;color:var(--mute)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>input{flex:1}
.big{padding:12px 16px;font-weight:600;justify-content:center}
.banner{background:var(--me);border:1px solid var(--accent);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opts label{display:grid;gap:3px;font-size:12px;color:var(--mute)}
/* Room */
.room{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.status{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;text-align:center;font-weight:600;padding:8px 10px;margin-bottom:8px;border-radius:10px;background:var(--card);border:1px solid var(--line);min-height:44px}
.status.win{background:var(--okbg);border-color:var(--ok)}
.status.lose{background:rgba(229,72,77,.15);border-color:var(--danger)}
.order{display:grid;grid-template-columns:1fr auto 1fr;gap:4px;align-items:center;margin-bottom:6px}
.seg{display:flex;align-items:center;gap:6px;padding:2px 8px;border-radius:8px;background:var(--card);border:1px solid var(--line);min-width:0;font-size:12px;opacity:.7;line-height:1.15}
.seg.on{opacity:1;border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.seg small{display:block;font-size:9px;letter-spacing:.4px;color:var(--mute);font-weight:700}
.seg .nm2{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg .turnmk{margin-left:auto;font-size:10px;color:var(--accent);font-weight:700;white-space:nowrap}
.arrow{color:var(--mute);font-weight:700}
.players{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.pl{position:relative;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0;box-shadow:var(--glow)}
.pl.turn{border-color:var(--accent)}
.pbody{display:flex;align-items:center;gap:10px}
.pl.r .pbody{flex-direction:row-reverse;text-align:right}
.av{position:relative;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:20px;color:#fff;flex:none}
.av .pc{position:absolute;right:-6px;bottom:-6px;background:var(--card);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;border:1px solid var(--line)}
.in{min-width:0;flex:1}
.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{font-weight:400;color:var(--mute)}
.st{font-size:12px;color:var(--mute)}
.st.off{color:var(--danger);font-weight:600}
.clk{text-align:center;flex:none}
.bank{font:700 20px/1 ui-monospace,Consolas,monospace}
.bank.low,.tl.low{color:var(--danger);animation:blink 1s steps(2) infinite}
.tl{font-size:11px;color:var(--mute);margin-top:2px;white-space:nowrap}
@keyframes blink{50%{opacity:.45}}
.pl .fx{position:absolute;left:34px;top:18px;width:0;height:0;pointer-events:none;z-index:6}
.pl.r .fx{left:auto;right:34px}
.rx{position:absolute;left:0;top:0;font-size:34px;animation:rise 2.4s ease-out forwards;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3));will-change:transform}
@keyframes rise{0%{transform:translate(0,10px) scale(.4);opacity:0}12%{opacity:1;transform:translate(0,0) scale(1.25)}100%{transform:translate(var(--dx,0),-110px) scale(1);opacity:0}}
.sk{position:absolute;left:-36px;top:-6px;font-size:64px;line-height:1;animation:skpop 3.6s ease-out forwards}
.sk img{width:84px;height:84px;object-fit:contain;display:block;margin:-10px -10px}
.pl.r .sk{left:auto;right:-36px}
@keyframes skpop{0%{transform:scale(.2) rotate(-20deg);opacity:0}8%{transform:scale(1.35) rotate(8deg);opacity:1}16%{transform:scale(1) rotate(-4deg)}85%{opacity:1}100%{transform:scale(.9) translateY(-14px);opacity:0}}
.bwrap{display:flex;overflow:auto;max-height:calc(100vh - 330px);min-height:220px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:var(--glow)}
.bwrap canvas{margin:auto;touch-action:manipulation;border-radius:6px;flex:none}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.tools input[type=range]{width:110px}
.tools label{display:flex;align-items:center;gap:5px;color:var(--mute);font-size:13px;cursor:pointer}
.tools button{padding:6px 11px}
.setbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px;padding:8px 10px;border:1px dashed var(--line);border-radius:10px;font-size:13px;color:var(--mute)}
.setbar select{padding:5px 8px}
/* Chat */
.chat{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;height:calc(100vh - 90px);max-height:720px;min-height:340px;position:sticky;top:60px;overflow:hidden;box-shadow:var(--glow)}
.chat h3{margin:0;padding:11px 14px;font-size:14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.chat h3 span{font-weight:400;color:var(--mute)}
.msgs{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:85%;align-self:flex-start;background:var(--bg);padding:6px 10px;border-radius:12px;border-top-left-radius:4px;word-break:break-word;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--me);border-radius:12px;border-top-right-radius:4px}
.msg .who{display:block;font-size:11px;color:var(--mute);margin-bottom:1px}
.msg.stk{background:transparent;padding:0}
.msg.stk .big{font-size:64px;line-height:1.1;display:block;animation:pop2 .35s ease-out}
.msg.stk img{width:112px;height:112px;object-fit:contain;display:block;animation:pop2 .35s ease-out}
@keyframes pop2{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.msg .tm{font-size:10px;color:var(--mute);display:block;text-align:right}
.sys{align-self:center;color:var(--mute);font-size:12px}
.quick{display:flex;gap:2px;padding:4px 8px 0;border-top:1px solid var(--line)}
.quick button{flex:1;border:0;background:transparent;font-size:22px;padding:3px 0;justify-content:center;border-radius:8px}
.quick button:hover{background:var(--bg);transform:scale(1.2)}
.chat form{display:flex;gap:6px;padding:8px}
.chat form input{flex:1}
.chat form button{padding:7px 10px}
.emo{border-top:1px solid var(--line);height:240px;display:flex;flex-direction:column}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;border-radius:0;background:transparent;padding:7px;color:var(--mute);justify-content:center}
.tabs button.on{color:var(--accent);box-shadow:inset 0 -2px var(--accent)}
.grid{flex:1;overflow-y:auto;padding:6px;display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:2px;align-content:start}
.grid.stk{grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:6px}
.grid button{border:0;background:transparent;font-size:24px;padding:4px;border-radius:8px;justify-content:center;position:relative}
.grid.stk button{font-size:44px}
.grid button:hover{background:var(--bg)}
.grid img{width:56px;height:56px;object-fit:contain}
.grid .rm{position:absolute;top:0;right:0;font-size:11px;line-height:1;background:var(--danger);color:#fff;border-radius:50%;width:16px;height:16px;display:none;place-items:center}
.grid button:hover .rm{display:grid}
.grid .add{font-size:26px;color:var(--accent);border:2px dashed var(--line)}
.hint{grid-column:1/-1;color:var(--mute);font-size:12px;padding:4px 6px}
/* History */
.list{display:grid;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--ink);text-decoration:none}
.item:hover{border-color:var(--accent)}
.chip{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;color:#fff}
.chip.w{background:var(--ok)}.chip.l{background:var(--danger)}.chip.d{background:var(--mute)}
.item small{color:var(--mute)}
.rp{display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap}
.rp input[type=range]{flex:1;min-width:120px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw}
#toast.on{opacity:1}
#tb,#esheet,.mobonly{display:none}
.adj{display:grid;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:13px}
.adj h5{margin:0;font-size:13px}
.adj label{display:grid;grid-template-columns:96px 1fr 38px;gap:8px;align-items:center;color:var(--mute)}
.adj label b{font-weight:600;color:var(--ink);text-align:right}
.adj input{width:100%;min-width:0}
#cflash{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.cf{position:absolute;text-align:center;translate:-50% -50%;animation:cfl 2.8s linear forwards}
.cf span{display:block;font-size:min(46vw,190px);line-height:1;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
.cf small{display:block;font-size:14px;font-weight:700;background:rgba(0,0,0,.6);color:#fff;border-radius:99px;padding:2px 12px;margin:6px auto 0;width:max-content}
@keyframes cfl{0%{opacity:0;transform:scale(.3)}8%{opacity:1;transform:scale(1.18)}16%{opacity:.08}24%{opacity:1}32%{opacity:.08}40%{opacity:1;transform:scale(1)}48%{opacity:.08}56%{opacity:1}100%{opacity:0;transform:scale(1.06)}}
#dlg{position:fixed;left:50%;top:60px;transform:translateX(-50%);z-index:55;background:var(--card);border:2px solid var(--accent);border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.3);display:flex;gap:10px;align-items:center;flex-wrap:wrap;width:min(430px,calc(100vw - 20px));justify-content:center}
.tbb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;padding:2px 0;font-size:10px;color:var(--mute);position:relative;min-width:0;border-radius:10px;justify-content:flex-start}
.tbb i{font-style:normal;width:40px;height:30px;border-radius:12px;display:grid;place-items:center;font-size:18px;background:var(--c);box-shadow:0 2px 6px color-mix(in srgb,var(--c) 50%,transparent)}
.tbb.on i{outline:3px solid color-mix(in srgb,var(--c) 45%,transparent)}
.tbb.on{color:var(--ink);font-weight:700}
.tbb .bd{position:absolute;top:-3px;left:calc(50% + 8px);background:#ef4444;color:#fff;border-radius:99px;font:700 10px/1 system-ui;padding:2px 5px;font-style:normal}
body:not([data-view=room]) .tb-room{display:none!important}
@media(max-width:860px){
  main{padding:8px 8px 96px}
  header .ib{display:none}
  .net span#netTxt{display:none}
  .room{grid-template-columns:1fr}
  .bwrap{max-height:none;padding:4px}
  .av{width:34px;height:34px;font-size:15px}.av .pc{width:20px;height:20px}.bank{font-size:16px}.pl{padding:5px 8px}.pbody{gap:8px}
  .status{min-height:36px;padding:5px 8px;font-size:14px}
  .tools{gap:6px}.tools button,.tools .btn{padding:6px 9px;font-size:13px}.tools input[type=range]{width:80px}
  .mobonly{display:inline-flex}
  .quick{display:none}
  .chat{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));top:auto;height:62vh;max-height:none;min-height:0;z-index:44;border-radius:16px 16px 0 0;transform:translateY(125%);transition:transform .22s ease;box-shadow:0 -8px 30px rgba(0,0,0,.3)}
  .chat.open{transform:none}
  .chat h3 span{margin-left:auto;margin-right:8px}
  .emo{height:200px}
  #esheet{display:flex;flex-direction:column;position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));height:50vh;z-index:44;background:var(--card);border:1px solid var(--line);border-radius:16px 16px 0 0;transform:translateY(125%);transition:transform .22s ease;box-shadow:0 -8px 30px rgba(0,0,0,.3)}
  #esheet.open{transform:none}
  #tb{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--card);border-top:1px solid var(--line);padding:6px 2px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;box-shadow:0 -4px 16px rgba(0,0,0,.12)}
  .pop{top:auto;bottom:calc(72px + env(safe-area-inset-bottom));left:8px;right:8px;width:auto;max-height:68vh;overflow:auto}
  #toast{bottom:90px}
}
</style>
</head>
<body>
<div id="fx"></div>
<header>
  <a class="logo" href="#/"><i>✕</i> Caro Online</a>
  <span class="sp"></span>
  <span class="net" id="net"><b></b><span id="netTxt">Đang kết nối…</span></span>
  <button class="ib" id="bpiece" title="Quân cờ của bạn">♟️</button>
  <button class="ib" id="btheme" title="Chủ đề giao diện">🎨</button>
  <button class="ib" id="bmode" title="Sáng / Tối">🌙</button>
  <button class="ib" id="snd" title="Bật/tắt âm thanh">🔊</button>
  <a class="btn ib" href="#/history" title="Lịch sử">📜</a>
</header>
<div class="pop" id="pop" hidden></div>
<main id="app"></main>
<div id="toast"></div>
<div id="cflash"></div>
<div id="dlg" hidden></div>
<nav id="tb">
  <button class="tbb tb-room" id="tb-chat" style="--c:#3b82f6"><i>💬</i>Chat<em class="bd" hidden></em></button>

<script>
'use strict';
/* ───────── Tiện ích ───────── */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ls = { get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem(k, v); return true; } catch { return false; } } };
const fmtTime = (ts) => new Date(ts).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });

const fmt = (ms) => { const s = Math.ceil(Math.max(0, ms) / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
let toastT; function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove('on'), 2800); }
const hue = (s) => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };

let pid = ls.get('caro_pid', '');
if (!/^[\w-]{8,64}$/.test(pid)) {
  pid = (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36) + Math.random().toString(36).slice(2));
  ls.set('caro_pid', pid);
}
let myName = ls.get('caro_name', '') || 'Người chơi ' + Math.floor(1000 + Math.random() * 9000);

/* ───────── Quân cờ: hình dạng & màu ───────── */
const SHAPES = [['x', 'X'], ['o', 'O'], ['dot', 'Tròn đặc'], ['sq', 'Vuông'], ['tri', 'Tam giác'], ['dia', 'Thoi'], ['heart', 'Tim'], ['star', 'Sao'], ['flower', 'Hoa'], ['plus', 'Dấu +']];
const COLORS = ['#2f6bff', '#ff4d5e', '#18b66a', '#ff9f1c', '#8e6bdc', '#00b8d9', '#ff6fb0', '#e0364f', '#111111', '#8b5a2b', '#00e5ff', '#ffd400'];
const DEF = [{ s: 'x', c: '#2f6bff' }, { s: 'o', c: '#ff4d5e' }];
let myStyle = null; try { myStyle = JSON.parse(ls.get('caro_style', 'null')); } catch {}
function drawPiece(g, shape, color, cx, cy, r) {
  g.save(); g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = color; g.fillStyle = color; g.lineWidth = Math.max(2, r * .38);
  g.beginPath();
  switch (shape) {
    case 'x': g.moveTo(cx - r, cy - r); g.lineTo(cx + r, cy + r); g.moveTo(cx + r, cy - r); g.lineTo(cx - r, cy + r); g.stroke(); break;
    case 'plus': g.moveTo(cx - r * 1.1, cy); g.lineTo(cx + r * 1.1, cy); g.moveTo(cx, cy - r * 1.1); g.lineTo(cx, cy + r * 1.1); g.stroke(); break;
    case 'o': g.arc(cx, cy, r * 1.05, 0, 6.2832); g.stroke(); break;
    case 'dot': g.arc(cx, cy, r * 1.1, 0, 6.2832); g.fill(); break;
    case 'sq': { const a = r * 1.0; g.roundRect ? g.roundRect(cx - a, cy - a, a * 2, a * 2, r * .3) : g.rect(cx - a, cy - a, a * 2, a * 2); g.fill(); break; }
    case 'tri': g.moveTo(cx, cy - r * 1.15); g.lineTo(cx + r * 1.15, cy + r * .85); g.lineTo(cx - r * 1.15, cy + r * .85); g.closePath(); g.fill(); break;
    case 'dia': g.moveTo(cx, cy - r * 1.25); g.lineTo(cx + r * 1.0, cy); g.lineTo(cx, cy + r * 1.25); g.lineTo(cx - r * 1.0, cy); g.closePath(); g.fill(); break;
    case 'heart': { const s = r * 1.15; g.moveTo(cx, cy + s * .95); g.bezierCurveTo(cx - s * 1.6, cy - s * .1, cx - s * .75, cy - s * 1.15, cx, cy - s * .4); g.bezierCurveTo(cx + s * .75, cy - s * 1.15, cx + s * 1.6, cy - s * .1, cx, cy + s * .95); g.fill(); break; }
    case 'star': for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .55 : r * 1.3; g[i ? 'lineTo' : 'moveTo'](cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); } g.closePath(); g.fill(); break;
    case 'flower': for (let k = 0; k < 5; k++) { const a = -Math.PI / 2 + k * 1.2566; g.moveTo(cx + Math.cos(a) * r * .6 + r * .52, cy + Math.sin(a) * r * .6); g.arc(cx + Math.cos(a) * r * .6, cy + Math.sin(a) * r * .6, r * .52, 0, 6.2832); } g.fill(); g.beginPath(); g.fillStyle = 'rgba(255,255,255,.8)'; g.arc(cx, cy, r * .26, 0, 6.2832); g.fill(); break;
  }

}
function pieceEl(st, px) {
  const c = document.createElement('canvas'), d = Math.min(devicePixelRatio || 1, 3);
  c.width = c.height = Math.round(px * d); c.style.width = c.style.height = px + 'px';
  const g = c.getContext('2d'); g.setTransform(d, 0, 0, d, 0, 0);
  drawPiece(g, st.s, st.c, px / 2, px / 2, px * .3); return c;
}
function effStyles(pl) {
  const a = { ...(pl[0]?.style || DEF[0]) }, b = { ...(pl[1]?.style || DEF[1]) };
  if (a.s === b.s && a.c === b.c) b.c = a.c === '#ff4d5e' ? '#2f6bff' : '#ff4d5e'; // trùng nhau → tự đổi màu quân thứ 2
  return [a, b];
}

/* ───────── Giao diện (theme) ───────── */
const THEMES = [
  ['light', 'Sáng', '#ffffff'], ['dark', 'Tối', '#12151c'], ['sakura', 'Anh đào Nhật Bản', '#f9a8c4'], ['tulip', 'Hoa tulip', '#e0364f'],
  ['pink', 'Hồng dịu dàng', '#ff9ccd'], ['neon', 'Cyber neon', '#00e5ff'], ['ocean', 'Đại dương', '#1e88e5'], ['forest', 'Rừng xanh', '#2e9e5b'],
  ['sunset', 'Hoàng hôn', '#ff6b35'], ['lavender', 'Oải hương', '#8e6bdc'], ['coffee', 'Cà phê & gỗ', '#8b5a2b'], ['galaxy', 'Dải ngân hà', '#a78bfa'],
];
const DARK = new Set(['dark', 'neon', 'galaxy']);
const FXE = { sakura: ['🌸', '🌸', '🌺'], tulip: ['🌷', '🌷', '🌱'], pink: ['💗', '🎀', '✨', '🌸'], neon: ['✦', '✧'], galaxy: ['✨', '⭐', '✦'], forest: ['🍃', '🍂'] };
let theme = ls.get('caro_theme', '') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
function applyTheme(id) {
  if (!THEMES.some((t) => t[0] === id)) id = 'light';
  theme = id; ls.set('caro_theme', id);
  document.documentElement.dataset.theme = id;
  $('#bmode').textContent = DARK.has(id) ? '☀️' : '🌙';
  const fx = $('#fx'); fx.innerHTML = '';
  (FXE[id] || []).length && Array.from({ length: 14 }, (_, i) => {
    const s = document.createElement('span'), e = FXE[id];
    s.textContent = e[i % e.length]; s.style.left = Math.random() * 100 + '%'; s.style.fontSize = 14 + Math.random() * 16 + 'px';
    s.style.animationDuration = 10 + Math.random() * 12 + 's'; s.style.animationDelay = -Math.random() * 20 + 's'; s.style.setProperty('--sw', (Math.random() * 120 - 60) + 'px');
    if (id === 'neon') s.style.color = i % 2 ? '#00e5ff' : '#ff2bd6';
    fx.appendChild(s);

}
document.documentElement.dataset.theme = theme;

/* ───────── Tương phản / độ sáng / độ đậm màu ───────── */
let adj = { c: 100, b: 100, s: 100 }; try { adj = { ...adj, ...JSON.parse(ls.get('caro_adj', '{}')) }; } catch {}
function applyAdj() {
  const d = adj.c === 100 && adj.b === 100 && adj.s === 100;
  document.documentElement.style.filter = d ? '' : `contrast(${adj.c}%) brightness(${adj.b}%) saturate(${adj.s}%)`;
  ls.set('caro_adj', JSON.stringify(adj));
}
/* ───────── Popover (quân cờ / theme) ───────── */
const pop = $('#pop'); let popKind = '';
function closePop() { pop.hidden = true; popKind = ''; }
document.addEventListener('click', (e) => { if (!pop.hidden && !pop.contains(e.target) && !e.target.closest('#bpiece,#btheme,#tb-theme,#tb-piece')) closePop(); });
new MutationObserver(() => { $('#tb-theme').classList.toggle('on', popKind === 'theme'); $('#tb-piece').classList.toggle('on', popKind === 'piece'); }).observe(pop, { attributes: true, attributeFilter: ['hidden'] });
$('#btheme').onclick = () => {
  if (popKind === 'theme') return closePop();
  popKind = 'theme'; pop.hidden = false;
  pop.innerHTML = '<h4>🎨 Chủ đề giao diện</h4><div class="chips"></div><div class="adj"><h5>👁 Chỉnh cho dễ nhìn</h5>' +
    [['c', 'Tương phản', 70, 150], ['b', 'Độ sáng', 70, 130], ['s', 'Độ đậm màu', 40, 160]].map(([k, n, a, b]) => `<label>${n}<input type="range" data-k="${k}" min="${a}" max="${b}" value="${adj[k]}"><b>${adj[k]}%</b></label>`).join('') +
    '<button id="adjr" style="justify-self:start">↺ Đặt lại</button></div>';
  $$('.adj input', pop).forEach((r) => r.oninput = () => { adj[r.dataset.k] = +r.value; r.nextElementSibling.textContent = r.value + '%'; applyAdj(); });
  $('#adjr', pop).onclick = () => { adj = { c: 100, b: 100, s: 100 }; applyAdj(); $$('.adj input', pop).forEach((r) => { r.value = 100; r.nextElementSibling.textContent = '100%'; }); };
  const box = $('.chips', pop);
  THEMES.forEach(([id, n, dot]) => {
    const d = document.createElement('div'); d.className = 'chip2' + (id === theme ? ' on' : '');
    d.innerHTML = `<i style="background:${dot}"></i>${esc(n)}`; d.onclick = () => { applyTheme(id); $$('.chip2', pop).forEach((x) => x.classList.toggle('on', x === d)); };
    box.appendChild(d);
  });
};
$('#bmode').onclick = () => applyTheme(DARK.has(theme) ? 'light' : 'dark');
$('#bpiece').onclick = () => {
  if (popKind === 'piece') return closePop();
  popKind = 'piece'; pop.hidden = false;
  const cur = { ...(myStyle || DEF[0]) };
  pop.innerHTML = '<h4>♟️ Quân cờ của bạn</h4><div class="shapes"></div><div class="sw"></div><p style="margin:10px 0 0;color:var(--mute);font-size:12px">Đối thủ sẽ thấy quân của bạn đúng như vậy. Nếu trùng cả hình lẫn màu với đối thủ, quân của người thứ 2 sẽ tự đổi màu.</p>';
  const sh = $('.shapes', pop), sw = $('.sw', pop);
  const save = () => { myStyle = { ...cur }; ls.set('caro_style', JSON.stringify(myStyle)); send({ t: 'style', ...myStyle }); draw(); };
  const draw = () => {
    sh.innerHTML = ''; sw.innerHTML = '';
    SHAPES.forEach(([s, n]) => { const b = document.createElement('button'); b.title = n; b.className = s === cur.s ? 'on' : ''; b.appendChild(pieceEl({ s, c: cur.c }, 30)); b.onclick = () => { cur.s = s; save(); }; sh.appendChild(b); });
    COLORS.forEach((c) => { const b = document.createElement('button'); b.style.background = c; b.className = c === cur.c ? 'on' : ''; b.onclick = () => { cur.c = c; save(); }; sw.appendChild(b); });
    const ci = document.createElement('input'); ci.type = 'color'; ci.value = cur.c; ci.title = 'Màu tùy chọn'; ci.onchange = () => { cur.c = ci.value; save(); }; sw.appendChild(ci);
  };
  draw();
};
$('#bpiece').onclick = $('#bpiece').onclick;

/* ───────── Âm thanh ───────── */
let snd = ls.get('caro_snd', '1') === '1', ac;
const AC = window.AudioContext || window.webkitAudioContext;
function beep(f = 660, d = .07) {
  if (!snd || !AC) return;
  try { ac = ac || new AC(); const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = f; g.gain.value = .07; o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d); } catch {}
}
const sndIcons = () => { $('#snd').textContent = snd ? '🔊' : '🔇'; $('#tb-snd i').textContent = snd ? '🔊' : '🔇'; $('#tb-snd').lastChild.textContent = snd ? 'Âm thanh' : 'Đã tắt'; };
$('#snd').onclick = () => { snd = !snd; ls.set('caro_snd', snd ? '1' : '0'); sndIcons(); if (snd) beep(700, .08); };
sndIcons();

/* ───────── Kết nối WebSocket (tự nối lại) ───────── */
const S = { ws: null, ready: false, u: '', stickers: [], first: true, lastRx: Date.now(), ping: null, retry: 0 };
let V = {};
function setNet(state, txt) { const n = $('#net'); n.className = 'net ' + state; $('#netTxt').textContent = txt; }
function send(o) { if (S.ws && S.ws.readyState === 1) { S.ws.send(JSON.stringify(o)); return true; } return false; }
function connect() {
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  S.ws = ws;
  ws.onopen = () => { S.retry = 0; S.lastRx = Date.now(); ws.send(JSON.stringify({ t: 'hello', pid, name: myName, style: myStyle })); };
  ws.onmessage = (e) => { S.lastRx = Date.now(); let m; try { m = JSON.parse(e.data); } catch { return; } onMsg(m); };
  ws.onclose = () => {
    if (S.ws !== ws) return;
    S.ready = false; setNet('bad', 'Mất kết nối — đang nối lại…');
    V.onOffline?.();
    setTimeout(connect, Math.min(2500, 250 * 2 ** S.retry++));
  };
  ws.onerror = () => {};
}
setInterval(() => {
  if (!S.ws || S.ws.readyState !== 1) return;
  if (Date.now() - S.lastRx > 12000) { try { S.ws.close(); } catch {} return; }
  send({ t: 'ping', ts: Date.now() });
}, 4000);
const wake = () => { if (!S.ws || S.ws.readyState > 1) { S.retry = 0; connect(); } else if (S.ws.readyState === 1) send({ t: 'ping', ts: Date.now() }); };
document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });
addEventListener('online', wake);
function onMsg(m) {
  switch (m.t) {
    case 'hello':
      S.ready = true; S.u = m.u; S.stickers = m.stickers || [];
      setNet('ok', 'Đã kết nối');
      if (S.first) { S.first = false; if (m.active && (location.hash === '' || location.hash === '#/')) { location.hash = '#/r/' + m.active; return; } }
      V.onReady?.(); break;
    case 'pong': S.ping = Date.now() - m.ts; setNet('ok', 'Đã kết nối · ' + S.ping + ' ms'); break;
    case 'created': location.hash = '#/r/' + m.code; break;
    case 'matched': toast('Đã ghép được đối thủ!'); location.hash = '#/r/' + m.code; break;
    default: V.onMsg?.(m);
  }
}

/* ───────── Vẽ bàn cờ: quân nằm trên GIAO ĐIỂM các đường kẻ ───────── */
function paint(cv, o) {
  const { size, cell, moves, win, hover, ghost, numbers, styles } = o, n = o.upto ?? moves.length;
  const dpr = Math.min(window.devicePixelRatio || 1, 3), W = size * cell;
  cv.style.width = cv.style.height = W + 'px';
  const px = Math.round(W * dpr); if (cv.width !== px) cv.width = cv.height = px;
  const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cs = getComputedStyle(document.documentElement), col = (k) => cs.getPropertyValue(k).trim();
  const C = (i) => (i + .5) * cell;
  g.fillStyle = col('--board'); g.fillRect(0, 0, W, W);
  g.strokeStyle = col('--grid'); g.lineWidth = 1; g.beginPath();
  for (let i = 0; i < size; i++) { const p = Math.round(C(i)) + .5; g.moveTo(p, C(0)); g.lineTo(p, C(size - 1)); g.moveTo(C(0), p); g.lineTo(C(size - 1), p); }
  g.stroke();
  if (size >= 13) { g.fillStyle = col('--grid'); const m = size >> 1, pts = [3, m, size - 4]; for (const a of pts) for (const b of pts) { g.beginPath(); g.arc(C(a), C(b), Math.max(2, cell * .09), 0, 6.2832); g.fill(); } }
  const R = cell * .3;
  if (win && n === moves.length) { g.fillStyle = col('--okbg'); for (const [x, y] of win) { g.beginPath(); g.arc(C(x), C(y), cell * .5, 0, 6.2832); g.fill(); } }
  if (n > 0) { const [lx, ly] = moves[n - 1]; g.fillStyle = col('--lastbg'); g.beginPath(); g.arc(C(lx), C(ly), cell * .5, 0, 6.2832); g.fill(); }
  for (let i = 0; i < n; i++) {
    const [x, y] = moves[i], st = styles[i % 2]; drawPiece(g, st.s, st.c, C(x), C(y), R);
    if (numbers && cell >= 24) { g.fillStyle = col('--mute'); g.font = '700 ' + Math.round(cell * .28) + 'px system-ui'; g.textAlign = 'left'; g.textBaseline = 'top'; g.fillText(i + 1, C(x) + cell * .12, C(y) + cell * .08); }
  }
  if (win && n === moves.length && win.length > 1) {
    const a = win[0], b = win[win.length - 1];
    g.strokeStyle = col('--ok'); g.lineWidth = Math.max(3, cell * .1); g.lineCap = 'round'; g.beginPath(); g.moveTo(C(a[0]), C(a[1])); g.lineTo(C(b[0]), C(b[1])); g.stroke();
  }
  if (hover && ghost) { g.globalAlpha = .4; drawPiece(g, ghost.s, ghost.c, C(hover[0]), C(hover[1]), R); g.globalAlpha = 1; }
}
function fitCell(bw, size) {
  const w = bw.clientWidth - 18, h = Math.max(260, innerHeight - 340);
  return Math.max(16, Math.min(56, Math.floor((w > 700 ? Math.min(w, h) : w) / size)));
}
function reasonText(res, pl) {
  if (!res) return '';
  const w = res.winner, wn = w != null ? pl[w].name : '', ln = w != null ? pl[1 - w].name : '';
  return { five: `🏆 ${wn} thắng với 5 quân liên tiếp!`, resign: `🏳️ ${ln} đầu hàng — ${wn} thắng`, timeout: `📡 ${ln} mất kết nối quá lâu — ${wn} thắng`, time: `⏰ ${ln} hết giờ — ${wn} thắng`, draw: '🤝 Hòa — bàn cờ đã đầy', abandoned: '⚠️ Trận bị hủy (cả hai cùng mất kết nối)' }[res.reason] || '';
}

/* ───────── Nhãn dán & emoji ───────── */
const EMOJI = Array.from('😀😃😄😁😆😅🤣😂🙂😉😊😇🥰😍🤩😘😋😛😜🤪😝🤗🤭🤔🤨😐😑😶🙄😏😣😥😮😯😪😫😴😌😎🤓😒😓😔😕🙃🤑😲😖😞😤😢😭😦😧😨😩🤯😬😰😱🥵🥶😳😵😡😠🤬😷🤒🤕🤢🤮🥳🥺😈👿💀👻👽🤖💩🙈🙉🙊👍👎👌✌️🤞🤟🤘👏🙌🤝🙏💪👀🧠❤️🧡💛💚💙💜🖤💔💕💖💯🔥✨⭐🌟🎉🎊🏆🥇🎯🎲🍀🌹🌷🌸🍺🍻🍕🍔🍟🍜🍣🍰☕🐶🐱🐭🐹🐰🦊🐻🐼🐨🐯🦁🐮🐷🐸🐵🐔🐧🦄🐢🐙');
const QUICK = ['👍', '❤️', '😂', '😮', '😢', '👏', '🔥', '🎉'];
const BUILTIN_STK = Array.from('😂🤣😍🥰😎🤩😭😡🥳😴🤔🙄😱🤯😏🤗🙏👍👎👏💪🔥💯🎉❤️💔😈👻💩🤡🍺🍕🏆🐶🐱🐵🐷🦄🌹🤝😜🥺😤😅');

let myStk = []; try { myStk = JSON.parse(ls.get('caro_stk', '[]')) || []; } catch {}
async function fileToSticker(f) {
  if (!/^image\/(png|webp|gif|jpeg)$/.test(f.type)) throw new Error('Chỉ nhận ảnh PNG / WebP / GIF / JPG');
  const MAX = 240 * 1024, rd = (b) => new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = ko; r.readAsDataURL(b); });
  if ((f.type === 'image/gif' || f.type === 'image/webp') && f.size <= MAX) return rd(f); // giữ nguyên ảnh động
  const bmp = await createImageBitmap(f), sc = Math.min(1, 256 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(bmp.width * sc)); c.height = Math.max(1, Math.round(bmp.height * sc));
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  let url = c.toDataURL('image/webp', .85); if (!url.startsWith('data:image/webp')) url = c.toDataURL('image/png');
  if (url.length * .75 > MAX) throw new Error('Ảnh quá lớn (tối đa ~240KB)');
  if (f.type === 'image/gif' || f.type === 'image/webp') toast('Ảnh động lớn quá nên chỉ lấy khung hình đầu');
  return url;
}

  const empty = (x, y) => x >= 0 && y >= 0 && x < R.size && y < R.size && !R.moves.some((q) => q[0] === x && q[1] === y);
  cv.addEventListener('pointerup', (e) => {
    if (!R || R.status !== 'playing' || R.you !== R.turn || (e.pointerType === 'mouse' && e.button !== 0)) return;
    const [x, y] = cellAt(e); if (!empty(x, y)) return;
    if (!send({ t: 'move', x, y })) return toast('Đang mất kết nối — chờ nối lại rồi đi tiếp nhé');
    if (R.moves.length > 0) R.bank[R.you] -= Date.now() - t0; // đi trước, server xác nhận sau
    R.moves.push([x, y]); R.turn = 1 - R.turn; t0 = Date.now(); hover = null; beep(520); renderPlayers(); renderStatus(); drawSoon();
  });
  cv.addEventListener('pointermove', (e) => {
    if (e.pointerType !== 'mouse' || !R || R.status !== 'playing' || R.you !== R.turn) return;
    const [x, y] = cellAt(e), h = empty(x, y) ? [x, y] : null;
    if (!hover !== !h || (h && hover && (h[0] !== hover[0] || h[1] !== hover[1]))) { hover = h; drawSoon(); }
  });
  cv.addEventListener('pointerleave', () => { if (hover) { hover = null; drawSoon(); } });

  $('#zoom').oninput = (e) => setCell(+e.target.value);
  $('#zm').onclick = () => setCell(cell - 4); $('#zp').onclick = () => setCell(cell + 4);
  $('#fit').onclick = () => R && setCell(fitCell(bw, R.size));
  $('#num').onchange = (e) => { numbers = e.target.checked; ls.set('caro_num', numbers ? '1' : '0'); draw(); };
  $('#share').onclick = async () => { const u = location.origin + '/#/r/' + code; try { await navigator.clipboard.writeText(u); toast('Đã chép link: ' + u); } catch { prompt('Chép link này gửi bạn bè:', u); } };
  $('#resign').onclick = () => { if (confirm('Bạn chắc chắn muốn đầu hàng?')) send({ t: 'resign' }); };
  $('#reset').onclick = () => send({ t: 'reset' });
  $('#undo').onclick = () => { if (!send({ t: 'undo' })) toast('Đang mất kết nối'); };
  $('#leave').onclick = () => {
    if (R && R.status === 'playing' && R.you >= 0 && !confirm('Rời phòng giữa trận sẽ bị xử thua. Tiếp tục?')) return;
    if (R && R.you >= 0 || R && R.status === 'finished') send({ t: 'leave' }); else location.hash = '#/';
    if (!S.ws || S.ws.readyState !== 1) location.hash = '#/';
  };

  /* chat, emoji, nhãn dán, phản ứng nhanh */
  const ci = $('#ci'), emo = $('#emo'), eg = $('#eg'); let tab = 'e';
  QUICK.forEach((e) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = e; b.title = 'Thả cảm xúc'; b.onclick = () => { if (R && R.you < 0) return toast('Người xem không thể thả cảm xúc'); send({ t: 'react', v: 'e:' + e }); }; $('#quick').appendChild(b); });
  function saveStk() { if (!ls.set('caro_stk', JSON.stringify(myStk))) { myStk.pop(); toast('Bộ nhớ trình duyệt đầy — hãy xóa bớt nhãn dán'); } }
  function sendSticker(o) { if (R && R.you < 0) return toast('Người xem không thể gửi nhãn dán'); if (!send({ t: 'sticker', ...o })) toast('Đang mất kết nối'); }
  const REACTS = Array.from('😂🤣😜😝🙈😏😈🤡💩👻🥱😴🤪😤😡🤬😭🥺😱🤯👏🔥💯🎉❤️😍🤔🙄');
  function fillEmo(g = eg, tb = tab) {
    g.innerHTML = ''; g.className = 'grid' + (tb === 'e' ? '' : ' stk');
    if (tb === 'e') { EMOJI.forEach((e) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = e; b.onclick = () => { ci.value += e; ci.focus(); }; g.appendChild(b); }); return; }
    if (tb === 'r') {
      REACTS.forEach((e) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = e; b.onclick = () => { if (R && R.you < 0) return toast('Người xem không thể thả cảm xúc'); send({ t: 'react', v: 'e:' + e }); }; g.appendChild(b); });
      const h = document.createElement('div'); h.className = 'hint'; h.textContent = 'Chạm để thả — emoji sẽ chớp chớp giữa màn hình của cả hai người. Bấm liên tục để chọc nhau!'; g.appendChild(h); return;
    }
    const add = (o, node, rm) => { const b = document.createElement('button'); b.type = 'button'; b.appendChild(node); b.onclick = () => sendSticker(o); if (rm) { const x = document.createElement('span'); x.className = 'rm'; x.textContent = '×'; x.onclick = (ev) => { ev.stopPropagation(); rm(); }; b.appendChild(x); } g.appendChild(b); };
    const ab = document.createElement('button'); ab.type = 'button'; ab.className = 'add'; ab.textContent = '➕'; ab.title = 'Thêm nhãn dán của bạn (PNG / WebP / GIF)';
    const fi = document.createElement('input'); fi.type = 'file'; fi.accept = 'image/png,image/webp,image/gif,image/jpeg'; fi.multiple = true; fi.hidden = true;
    ab.onclick = () => fi.click();
    fi.onchange = async () => { for (const f of fi.files) { try { if (myStk.length >= 40) throw new Error('Tối đa 40 nhãn dán'); myStk.push(await fileToSticker(f)); saveStk(); } catch (e) { toast(e.message || 'Không thêm được ảnh'); } } fillEmo(g, tb); };
    g.appendChild(ab); g.appendChild(fi);
    myStk.forEach((d, i) => { const im = document.createElement('img'); im.src = d; add({ data: d }, im, () => { myStk.splice(i, 1); saveStk(); fillEmo(g, tb); }); });
    S.stickers.forEach((f) => add({ v: 'i:' + f }, stickerNode('i:' + f)));
    BUILTIN_STK.forEach((e) => { const s = document.createElement('span'); s.textContent = e; add({ v: 'e:' + e }, s); });
    const h = document.createElement('div'); h.className = 'hint'; h.textContent = 'Mẹo: tải nhãn dán (WebP/GIF/PNG) từ SigStick hoặc nơi khác về máy, rồi bấm ➕ để thêm. Ảnh động vẫn chạy (≤ 240KB).'; g.appendChild(h);
  }
  /* khay chat / cảm xúc trên điện thoại */
  const chatEl = $('.chat'), esheet = $('#esheet'); let unread = 0, esTab = 'r';
  function isMob() { return matchMedia('(max-width:860px)').matches; }
  const setBadge = () => { const b = $('#tb-chat .bd'); b.textContent = unread > 9 ? '9+' : unread; b.hidden = !unread; };
  function sheet(which) {
    const c = which === 'chat' && !chatEl.classList.contains('open'), e = which === 'emo' && !esheet.classList.contains('open');
    chatEl.classList.toggle('open', c); esheet.classList.toggle('open', e);
    $('#tb-chat').classList.toggle('on', c); $('#tb-emo').classList.toggle('on', e);
    if (c) { unread = 0; setBadge(); const m = $('#msgs'); m.scrollTop = m.scrollHeight; }
    if (e) fillEmo($('#esg'), esTab);
  }
  V.toggleChat = () => sheet('chat'); V.toggleEmo = () => sheet('emo');
  $('#cclose').onclick = () => sheet(null);
  $$('.tabs button', esheet).forEach((b) => b.onclick = () => { esTab = b.dataset.t; $$('.tabs button', esheet).forEach((x) => x.classList.toggle('on', x === b)); fillEmo($('#esg'), esTab); });
  function flash(v, name) { // emoji chớp chớp giữa màn hình rồi mờ dần
    const box = $('#cflash'), d = document.createElement('div'); d.className = 'cf';
    d.style.left = (50 + (Math.random() * 30 - 15)) + '%'; d.style.top = (42 + (Math.random() * 20 - 10)) + '%';
    d.innerHTML = `<span>${esc(v.slice(2))}</span><small>${esc(name)}</small>`; box.appendChild(d);
    setTimeout(() => d.remove(), 2900); while (box.children.length > 6) box.firstChild.remove();
  }
  $('#eb').onclick = () => { emo.hidden = !emo.hidden; if (!emo.hidden) fillEmo(); };
  $$('.tabs button', emo).forEach((b) => b.onclick = () => { tab = b.dataset.t; $$('.tabs button', emo).forEach((x) => x.classList.toggle('on', x === b)); fillEmo(); });
  $('#cf').onsubmit = (e) => { e.preventDefault(); const t = ci.value.trim(); if (!t) return; if (R && R.you < 0) return toast('Người xem không thể chat'); if (send({ t: 'chat', text: t })) ci.value = ''; else toast('Đang mất kết nối'); };
}

/* ───────── Lịch sử ───────── */
function viewHistory() {
  app.innerHTML = `<div class="lobby" style="max-width:720px"><h1 style="margin:0">📜 Lịch sử ván đấu</h1><div class="list" id="ls"><p>Đang tải…</p></div></div>`;
  const load = async () => {
    const box = $('#ls');
    try {
      const list = await (await fetch('/api/games?u=' + S.u)).json();
      if (!list.length) { box.innerHTML = '<p>Chưa có ván nào. Hãy chơi một ván nhé!</p>'; return; }
      box.innerHTML = '';
      for (const g of list) {
        const me = g.players.findIndex((p) => p.u === S.u), op = g.players[1 - me];
        const w = g.result?.winner, cls = w == null ? 'd' : w === me ? 'w' : 'l', txt = w == null ? 'Hòa' : w === me ? 'Thắng' : 'Thua';
        const a = document.createElement('a'); a.className = 'item'; a.href = '#/replay/' + g.id;
        a.innerHTML = `<span class="chip ${cls}">${txt}</span><div style="flex:1;min-width:0"><div><b>${esc(op ? op.name : '—')}</b> <small>(bạn đi ${me ? 'sau' : 'trước'})</small></div><small>${fmtDate(g.endedAt)} · ${g.moves} nước · bàn ${g.size}×${g.size}</small></div><span>▶ Xem lại</span>`;
        box.appendChild(a);
      }
    } catch { box.innerHTML = '<p>Không tải được lịch sử.</p>'; }
  };
  V.onReady = load; if (S.ready) load();
}

/* ───────── Xem lại ván ───────── */
async function viewReplay(id) {
  app.innerHTML = `<p style="text-align:center">Đang tải ván đấu…</p>`;
  let G; try { const r = await fetch('/api/games/' + id); if (!r.ok) throw 0; G = await r.json(); } catch { app.innerHTML = `<div class="lobby"><div class="card"><h2 style="margin-top:0">Không tìm thấy ván đấu</h2><a class="btn pri" href="#/history">Về lịch sử</a></div></div>`; return; }
  if (location.hash !== '#/replay/' + id) return;
  const N = G.moves.length, sty = effStyles(G.players);
  app.innerHTML = `<div class="room"><section>
    <div class="status" id="status"></div>
    <div class="order" id="order"></div>
    <div class="bwrap" id="bw"><canvas id="cv"></canvas></div>
    <div class="rp"><button id="first">⏮</button><button id="prev">◀</button><button class="pri" id="play">▶ Phát</button><button id="next">▶</button><button id="last">⏭</button>
      <input type="range" id="sl" min="0" max="${N}" value="${N}"><span id="pos"></span></div>
    <div class="tools"><button id="zm">−</button><input type="range" id="zoom" min="16" max="64"><button id="zp">+</button><button id="fit">Vừa khung</button>
      <label><input type="checkbox" id="num"> Số thứ tự</label><span class="sp"></span>
      <select id="spd"><option value="1200">Chậm</option><option value="700" selected>Vừa</option><option value="300">Nhanh</option></select>
      <button id="share">🔗 Chép link ván này</button><a class="btn" href="#/history">← Lịch sử</a></div>
  </section><aside class="chat"><h3>💬 Chat trong ván <span>${fmtDate(G.startedAt)}</span></h3><div class="msgs" id="msgs"></div></aside></div>`;
  const cv = $('#cv'), bw = $('#bw'); let pos = N, cell = +ls.get('caro_cell', '0') || fitCell(bw, G.size), numbers = ls.get('caro_num', '0') === '1', timer = 0;
  $('#num').checked = numbers;
  const ord = $('#order');
  [0, 1].forEach((i) => {
    const seg = document.createElement('div'); seg.className = 'seg'; seg.id = 'o' + i; seg.appendChild(pieceEl(sty[i], 18));
    const d = document.createElement('div'); d.innerHTML = `<small>${i ? '② ĐI SAU' : '① ĐI TRƯỚC'}</small><div class="nm2">${esc(G.players[i].name)}${G.players[i].u === S.u ? ' (bạn)' : ''}</div>`; seg.appendChild(d); ord.appendChild(seg);
    if (i === 0) { const a = document.createElement('div'); a.className = 'arrow'; a.textContent = '⇄'; ord.appendChild(a); }
  });
  const draw = () => {
    paint(cv, { size: G.size, cell, moves: G.moves, win: G.result?.line, upto: pos, numbers, styles: sty });
    $('#sl').value = pos; $('#pos').textContent = pos + '/' + N; $('#zoom').value = cell;
    const st = $('#status'), fin = pos === N;
    st.className = 'status'; st.textContent = fin ? reasonText(G.result, G.players) : `Nước thứ ${pos}${pos ? ' — ' + G.players[(pos - 1) % 2].name : ''}`;
    $('#o0').classList.toggle('on', pos % 2 === 0 && !fin); $('#o1').classList.toggle('on', pos % 2 === 1 && !fin);
  };
  V.onTheme = draw;
  const go = (p) => { pos = Math.max(0, Math.min(N, p)); draw(); };
  const stop = () => { clearInterval(timer); timer = 0; $('#play').textContent = '▶ Phát'; };
  const play = () => { if (timer) return stop(); if (pos >= N) pos = 0; $('#play').textContent = '⏸ Dừng'; timer = setInterval(() => { if (pos >= N) return stop(); go(pos + 1); beep(600, .04); }, +$('#spd').value); draw(); };
  $('#spd').onchange = () => { if (timer) { stop(); play(); } };
  $('#first').onclick = () => { stop(); go(0); }; $('#last').onclick = () => { stop(); go(N); };
  $('#prev').onclick = () => { stop(); go(pos - 1); }; $('#next').onclick = () => { stop(); go(pos + 1); };
  $('#play').onclick = play; $('#sl').oninput = (e) => { stop(); go(+e.target.value); };
  const zoom = (c) => { cell = Math.max(16, Math.min(64, c)); ls.set('caro_cell', cell); draw(); };
  $('#zoom').oninput = (e) => zoom(+e.target.value); $('#zm').onclick = () => zoom(cell - 4); $('#zp').onclick = () => zoom(cell + 4);
  $('#fit').onclick = () => zoom(fitCell(bw, G.size));
  $('#num').onchange = (e) => { numbers = e.target.checked; ls.set('caro_num', numbers ? '1' : '0'); draw(); };
  $('#share').onclick = async () => { const u = location.origin + '/#/replay/' + id; try { await navigator.clipboard.writeText(u); toast('Đã chép link ván đấu'); } catch { prompt('Chép link:', u); } };
  const key = (e) => { if (e.target.tagName === 'INPUT' && e.target.type === 'text') return; if (e.key === 'ArrowLeft') { stop(); go(pos - 1); } else if (e.key === 'ArrowRight') { stop(); go(pos + 1); } else if (e.key === ' ') { e.preventDefault(); play(); } };
  addEventListener('keydown', key);
  V.dispose = () => { stop(); removeEventListener('keydown', key); };
  const box = $('#msgs');
  if (!G.chat.length) box.innerHTML = '<div class="sys">Ván này không có tin nhắn.</div>';
  for (const m of G.chat) {
    const d = document.createElement('div'); d.className = 'msg' + (m.u === S.u ? ' me' : '');
    const w = document.createElement('span'); w.className = 'who'; w.textContent = m.name; d.appendChild(w);
    if (m.k === 's') { d.classList.add('stk'); d.appendChild(stickerNode(m.v)); } else d.appendChild(document.createTextNode(m.v));
    const t = document.createElement('span'); t.className = 'tm'; t.textContent = '+' + fmt(m.ts - G.startedAt); d.appendChild(t); box.appendChild(d);
  }
  draw();
}

$('#tb-chat').onclick = () => V.toggleChat?.();
$('#tb-emo').onclick = () => V.toggleEmo?.();
$('#tb-theme').onclick = () => $('#btheme').click();
$('#tb-piece').onclick = () => $('#bpiece').click();
$('#tb-snd').onclick = () => $('#snd').click();
$('#tb-hist').onclick = () => { location.hash = '#/history'; };
applyAdj();
applyTheme(theme);
connect();
route();
</script>
</body>
</html>
